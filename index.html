    <script>
      (function() {
        var _parse = JSON.parse;
        JSON.parse = function(text, reviver) {
          if (text === undefined || text === 'undefined' || text === null || text === 'null' || text === '') {
            return null;
          }
          try {
            return _parse.call(this, text, reviver);
          } catch (err) {
            if (typeof text === 'string' && (text.indexOf('undefined') !== -1 || text.trim() === '')) {
              return null;
            }
            throw err;
          }
        };
      })();
    </script>
